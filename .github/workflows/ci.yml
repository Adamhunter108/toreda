name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    # All three platforms are first-class, so all three run on every push.
    # Windows especially: it is the one nobody develops on, so it is the one
    # that breaks silently.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
